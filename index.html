<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FGV | Curso de Vendas</title>

  <style>
    :root {
      --verde: #00c853;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      line-height: 1.6;
    }

    header {
      padding: 70px 20px;
      text-align: center;
      border-bottom: 1px solid #111;
      animation: fadeDown 1s ease;
    }

    header h1 {
      font-size: 48px;
      letter-spacing: 6px;
    }

    header .linha {
      width: 60px;
      height: 3px;
      background: var(--verde);
      margin: 15px auto;
    }

    header p {
      font-size: 20px;
      color: #ccc;
      max-width: 700px;
      margin: auto;
    }

    section {
      padding: 70px 20px;
      max-width: 1000px;
      margin: auto;
      animation: fadeUp 1s ease;
    }

    section h2 {
      font-size: 34px;
      margin-bottom: 20px;
      text-align: center;
      color: var(--verde);
    }

    section p {
      color: #ccc;
      text-align: center;
      font-size: 18px;
      max-width: 800px;
      margin: auto;
    }

    .servicos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
      margin-top: 50px;
    }

    .card {
      border: 1px solid #222;
      padding: 35px;
      border-radius: 12px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      border-color: var(--verde);
      transform: translateY(-6px);
    }

    .card h3 {
      margin-bottom: 15px;
      font-size: 22px;
      color: var(--verde);
    }

    .card p {
      font-size: 16px;
      color: #bbb;
    }
